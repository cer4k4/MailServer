  postgres:
    image: postgres:17
    container_name: postfixadmin-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: postfixadmin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postfixadmin_postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - mailnet

  postfixadmin:
    image: postfixadmin:latest
    container_name: postfixadmin
    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "8000:80"

    environment:
      POSTFIXADMIN_DB_TYPE: pgsql
      POSTFIXADMIN_DB_HOST: postgres
      POSTFIXADMIN_DB_USER: postgres
      POSTFIXADMIN_DB_NAME: postfixadmin
      POSTFIXADMIN_DB_PASSWORD: postgres
      POSTFIXADMIN_SETUP_PASSWORD: changeme
      POSTFIXADMIN_ENCRYPT: md5crypt


    volumes:
      - postfixadmin_data:/var/www/html

    networks:
      - mailnet

  postfix:
    build:
      context: ./postfix
    container_name: postfix
    restart: always

    depends_on:
      - postgres
      - dovecot

    hostname: mail
    domainname: lab.ir

    ports:
      - "25:25"
      - "587:587"

    volumes:
      - maildata:/var/mail
      - ./certs:/etc/postfix/certs:ro

    networks:
      - mailnet

  dovecot:
    build:
      context: ./dovecot
    container_name: dovecot
    restart: always

    depends_on:
      - postgres

    ports:
      - "143:143"
      - "993:993"

    volumes:
      - maildata:/var/mail
      - ./certs:/etc/dovecot/certs:ro
      - ./certs/fullchain.pem:/etc/dovecot/certs/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/dovecot/certs/privkey.pem:ro

    networks:
      - mailnet

  # it's Dashboard for login
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube

    depends_on:
      - postgres
      - dovecot
      - postfix

    ports:
      - "8080:80"

    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://dovecot
      ROUNDCUBEMAIL_DEFAULT_PORT: 993

      ROUNDCUBEMAIL_SMTP_SERVER: tls://postfix
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_DB_TYPE: pgsql
      ROUNDCUBEMAIL_DB_HOST: postgres
      ROUNDCUBEMAIL_DB_USER: postgres
      ROUNDCUBEMAIL_DB_NAME: postfixadmin
      ROUNDCUBEMAIL_DB_PASSWORD: postgres

    networks:
      - mailnet

